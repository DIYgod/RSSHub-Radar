name: check-legacy-store-credentials

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check legacy Chrome credentials
        uses: wdzeng/chrome-extension@v2.0.0
        with:
          action: check-credentials
          client-id: ${{ fromJSON(secrets.SUBMIT_KEYS).chrome.clientId }}
          client-secret: ${{ fromJSON(secrets.SUBMIT_KEYS).chrome.clientSecret }}
          refresh-token: ${{ fromJSON(secrets.SUBMIT_KEYS).chrome.refreshToken }}
      - name: Check legacy Edge credentials
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: |
          EDGE_CLIENT_ID=$(echo "$SUBMIT_KEYS" | jq -r '.edge.clientId')
          EDGE_CLIENT_SECRET=$(echo "$SUBMIT_KEYS" | jq -r '.edge.clientSecret')
          EDGE_TOKEN_URL=$(echo "$SUBMIT_KEYS" | jq -r '.edge.accessTokenUrl')
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$EDGE_TOKEN_URL" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$EDGE_CLIENT_ID" \
            --data-urlencode "client_secret=$EDGE_CLIENT_SECRET" \
            --data-urlencode "scope=https://api.addons.microsoftedge.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")
          echo "Edge token endpoint status: $STATUS"
          test "$STATUS" = "200"
